services:
  nginx:
    image: lscr.io/linuxserver/nginx
    container_name: hrefs-nginx
    environment:
      PUID: ${HREFS_NGINX_PUID:-1000}
      PGID: ${HREFS_NGINX_PGID:-1000}
      TZ: ${HREFS_NGINX_TZ:-Etc/UTC}
    volumes:
      - ./www:/config/www
    ports:
      - ${HREFS_NGINX_HTTP_PORT:-80}:80
      - ${HREFS_NGINX_HTTPS_PORT:-443}:443
    restart: unless-stopped